
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rectangles</title>

    <style>
        .outside {
            border: 5px dotted blue;
            border-radius: 30px;
            padding: 20px;
        }

        .middle {
            border: 3px dashed red;
            border-radius: 20px;
            padding: 20px;
        }

        .inner {
            border: 2px solid green;
            border-radius: 5px;
            padding: 30px;
            text-align: center;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heavily packed &lt;DIV&gt;
            </div>
        </div>
    </div>

</body>
</html>
