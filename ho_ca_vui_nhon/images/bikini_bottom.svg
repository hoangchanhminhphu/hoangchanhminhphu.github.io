<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe3f0"/><stop offset="0.55" stop-color="#3fb5d8"/><stop offset="1" stop-color="#1b7fb0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1deaa"/><stop offset="1" stop-color="#d9bd7a"/>
    </linearGradient>
    <g id="flower">
      <circle cx="0" cy="0" r="6" fill="#fff"/>
      <g fill="#ff9ad5"><circle cx="0" cy="-13" r="9"/><circle cx="12" cy="-4" r="9"/><circle cx="8" cy="11" r="9"/><circle cx="-8" cy="11" r="9"/><circle cx="-12" cy="-4" r="9"/></g>
      <circle cx="0" cy="0" r="6" fill="#ffe14d"/>
    </g>
  </defs>
  <rect width="960" height="560" fill="url(#w)"/>
  <!-- tia nắng -->
  <g fill="#ffffff" opacity="0.12">
    <polygon points="120,0 200,0 330,470 150,470"/><polygon points="420,0 480,0 600,470 440,470"/><polygon points="720,0 790,0 900,470 740,470"/>
  </g>
  <!-- hoa trên trời -->
  <g opacity="0.85">
    <use href="#flower" transform="translate(110,60) scale(1.3)"/>
    <use href="#flower" transform="translate(330,105) scale(1)"/>
    <use href="#flower" transform="translate(560,50) scale(1.5)"/>
    <use href="#flower" transform="translate(800,95) scale(1.1)"/>
  </g>
  <!-- đồi xa -->
