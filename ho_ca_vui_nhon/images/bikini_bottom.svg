    <ellipse cx="70" cy="215" rx="55" ry="10" fill="#000" opacity="0.15"/>
    <path d="M70 -10 L50 40 L70 20 L90 40Z" fill="#2f9e44"/>
    <path d="M70 -20 L58 40 L70 25 L82 40Z" fill="#3cb44a"/>
    <path d="M20 60 Q70 30 120 60 L125 190 Q70 225 15 190Z" fill="#f4a21d" stroke="#b86e00" stroke-width="3"/>
    <g stroke="#c47a05" stroke-width="2" opacity="0.7"><path d="M25 90 L115 130"/><path d="M115 90 L25 130"/><path d="M25 140 L115 180"/><path d="M115 140 L25 180"/></g>
    <circle cx="70" cy="95" r="17" fill="#cfeef7" stroke="#8a5a1d" stroke-width="5"/>
    <circle cx="70" cy="95" r="17" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <rect x="50" y="150" width="40" height="52" rx="18" fill="#7c4a1a"/>
    <circle cx="82" cy="178" r="3" fill="#ffd34d"/>
  </g>
  <!-- nhà Squidward (moai) -->
  <g transform="translate(395,255)">
    <ellipse cx="55" cy="205" rx="45" ry="8" fill="#000" opacity="0.15"/>
    <path d="M20 205 L25 60 Q55 20 85 60 L90 205Z" fill="#9aa5ad" stroke="#5f6b73" stroke-width="3"/>
    <rect x="22" y="78" width="66" height="14" rx="6" fill="#5f6b73"/>
    <ellipse cx="38" cy="85" rx="9" ry="6" fill="#222"/><ellipse cx="72" cy="85" rx="9" ry="6" fill="#222"/>
    <path d="M52 95 L58 120 L48 120Z" fill="#7d8991"/>
    <rect x="35" y="140" width="40" height="12" rx="4" fill="#5f6b73"/>
    <rect x="42" y="165" width="26" height="40" rx="10" fill="#444"/>
  </g>
  <!-- nhà Patrick (tảng đá) -->
  <g transform="translate(700,330)">
    <ellipse cx="110" cy="140" rx="105" ry="12" fill="#000" opacity="0.15"/>
    <path d="M10 140 Q0 70 55 40 Q110 5 165 40 Q220 75 210 140Z" fill="#a66f4e" stroke="#6e4430" stroke-width="3"/>
