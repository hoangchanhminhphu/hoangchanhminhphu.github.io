
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tính số ngày trong tháng</title>
</head>
<body>

    <h1>Tính số ngày trong tháng</h1>

    <input type="number" id="thang" placeholder="Nhập tháng">

    <button onclick="tinhSoNgay()">Tính số ngày</button>

    <p id="ket_qua"></p>

    <script>
        function tinhSoNgay() {
            var thang = Number(document.getElementById("thang").value);
            var ketqua = "";

            switch (thang) {
                case 1:
                case 3:
                case 5:
                case 7:
                case 8:
                case 10:
                case 12:
                    ketqua = "Tháng " + thang + " có 31 ngày";
                    break;

                case 4:
                case 6:
                case 9:
                case 11:
                    ketqua = "Tháng " + thang + " có 30 ngày";
                    break;

                case 2:
                    ketqua = "Tháng 2 có 28 hoặc 29 ngày";
                    break;

                default:
                    ketqua = "Tháng không hợp lệ";
            }

            document.getElementById("ket_qua").innerHTML = ketqua;
        }
    </script>

</body>
</html>
